global
    log stdout format raw local0
    maxconn 512
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend public_tls
    bind 0.0.0.0:443
    tcp-request inspect-delay 3s
    acl turn_name req.ssl_sni -i "${VMAX_TURN_DOMAIN}"
    acl signal_name req.ssl_sni -i "${VMAX_SIGNAL_DOMAIN}"
    tcp-request content reject if { req.ssl_hello_type 1 } !turn_name !signal_name
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend coturn_tls if turn_name
    use_backend signal_tls if signal_name

backend coturn_tls
    server coturn 127.0.0.1:5349

backend signal_tls
    server websocket 127.0.0.1:8443

frontend regional_https
    mode http
    bind 127.0.0.1:8443 ssl crt /run/vmax-certs/haproxy.pem alpn http/1.1
    timeout http-request 5s
    http-request return status 200 content-type text/plain string ok if { path /healthz }
    http-request deny deny_status 404 unless { path /v1 }
    default_backend regional_ws

backend regional_ws
    mode http
    timeout tunnel 1h
    server signaling 127.0.0.1:8788
