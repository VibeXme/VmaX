[package]
name = "vmax-relay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring"] }

[dev-dependencies]
ring = "0.17"
turn = "0.17.3"
webrtc-util = { version = "0.17.1", default-features = false, features = ["conn"] }
