[package]
name = "vmax"
version = "5.3.9"
description = "VmaX — Ultra-low-latency P2P remote desktop and game streaming"
authors = ["VmaX Contributors"]
edition = "2024"

[lib]
name = "vmax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
semver = "1.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
ed25519-dalek = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1", features = ["full"] }
iroh = "1.4"
iroh-tickets = "1.0"
rusty_enet = "0.4.1"
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }
quinn = "0.11"
socket2 = "0.6"
reed-solomon-erasure = "6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring"] }
rcgen = "0.14"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
futures-util = "0.3"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
getrandom = "0.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
turn = "0.17.3"
webrtc-util = { version = "0.17.1", default-features = false, features = ["conn"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
base64 = "0.22"
cpal = "0.18.2"
nnnoiseless = { version = "0.5.2", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
opus1 = "0.3"


[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
jni = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
gilrs = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.27.0"
mini-nvcodec = "0.1.0"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_Security_Cryptography",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
