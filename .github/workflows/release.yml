name: Build and publish VmaX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vmax-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path relay-server/Cargo.toml --locked
      - name: Build Linux x86-64 signaling relay
        run: |
          cargo build --manifest-path relay-server/Cargo.toml --release --locked
          tar -C relay-server/target/release -czf VmaX-Relay-Linux-x86_64.tar.gz vmax-relay
      - uses: actions/upload-artifact@v4
        with:
          name: vmax-relay-linux
          path: VmaX-Relay-Linux-x86_64.tar.gz
          if-no-files-found: error

  rebuild-release-binaries:
    needs: relay-tests
    if: github.repository == 'VibeXme/VmaX' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend and Tauri dependencies
        shell: pwsh
        run: npm ci

      - name: Install Rust targets
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc

      - name: Fetch and verify required Windows tunnel helper
        shell: pwsh
        run: |
          $path = 'src-tauri/resources/cloudflared.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          $url = 'https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-windows-amd64.exe'
          Invoke-WebRequest -Uri $url -OutFile $path -MaximumRedirection 10
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          $expected = '2493dbc168923bb3e59e5e7716f71deced92992eea9acd6e9d74f84ac7751343'
          if ($actual -ne $expected) { throw "cloudflared.exe checksum mismatch: $actual" }

      - name: Run Rust authentication and transport unit tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'vmax-rust-tests.log'
          cargo test --manifest-path src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc --locked -- --test-threads=2 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status) {
            $tail = Get-Content $log -Tail 75
            @('### Windows Rust test failure', '', '```text') + $tail + '```' |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            $summary = $tail -join "`n"
            if ($summary.Length -gt 3000) { $summary = $summary.Substring($summary.Length - 3000) }
            $summary = $summary.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows Rust tests failed::$summary"
            exit $status
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          npm.cmd run tauri -- build --ci --no-bundle --target x86_64-pc-windows-msvc -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $meta = cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps --locked | ConvertFrom-Json
          $exe = Join-Path $meta.target_directory 'x86_64-pc-windows-msvc\release\vmax.exe'
          if (-not (Test-Path $exe)) { throw "Windows executable was not produced at $exe" }
          Copy-Item -LiteralPath $exe -Destination 'VmaX.exe' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: vmax-windows
          path: VmaX.exe
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up the Android toolchain
        shell: bash
        run: |
          rustup target add aarch64-linux-android
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            archive="$RUNNER_TEMP/android-cmdline-tools.zip"
            curl --fail --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$archive"
            unzip -q "$archive" -d "$RUNNER_TEMP/android-cli"
            mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$ANDROID_HOME/cmdline-tools/vmax"
            sdkmanager="$ANDROID_HOME/cmdline-tools/vmax/bin/sdkmanager"
          fi
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || test "${PIPESTATUS[1]}" = 0
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME" >>"$GITHUB_ENV"
          printf 'NDK_HOME=%s/ndk/29.0.14206865\n' "$ANDROID_HOME" >>"$GITHUB_ENV"
          npm ci
      - name: Build the Android ARM64 APK
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          npm run tauri -- android build --ci --apk --target aarch64 -- --locked
      - name: Sign and verify the Android APK
        shell: bash
        env:
          VMAX_ANDROID_KEYSTORE_BASE64: ${{ secrets.VMAX_ANDROID_KEYSTORE_BASE64 }}
          VMAX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VMAX_ANDROID_KEYSTORE_PASSWORD }}
          VMAX_ANDROID_KEY_ALIAS: ${{ secrets.VMAX_ANDROID_KEY_ALIAS }}
          VMAX_ANDROID_KEY_PASSWORD: ${{ secrets.VMAX_ANDROID_KEY_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/37.0.0"
          unsigned=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          if [[ -n "$VMAX_ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$VMAX_ANDROID_KEYSTORE_BASE64" | base64 --decode >"$keystore"
          else
            rm -f "$keystore"
            export VMAX_ANDROID_KEYSTORE_PASSWORD=android VMAX_ANDROID_KEY_PASSWORD=android VMAX_ANDROID_KEY_ALIAS=androiddebugkey
            keytool -genkeypair -keystore "$keystore" -storepass:env VMAX_ANDROID_KEYSTORE_PASSWORD -keypass:env VMAX_ANDROID_KEY_PASSWORD -alias "$VMAX_ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=VmaX Android Development'
          fi
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$VMAX_ANDROID_KEY_ALIAS" --ks-pass env:VMAX_ANDROID_KEYSTORE_PASSWORD --key-pass env:VMAX_ANDROID_KEY_PASSWORD --out VmaX-Android-arm64.apk "$unsigned"
          "$tools/apksigner" verify VmaX-Android-arm64.apk
          "$tools/aapt" dump permissions VmaX-Android-arm64.apk > apk-permissions.txt
          grep -F android.permission.CAMERA apk-permissions.txt
          node tools/verify-android-decoder.mjs VmaX-Android-arm64.apk "$tools/dexdump"
      - uses: actions/upload-artifact@v4
        with:
          name: vmax-android
          path: VmaX-Android-arm64.apk
          if-no-files-found: error

  publish-release:
    needs: [relay-tests, rebuild-release-binaries, android-apk]
    if: github.repository == 'VibeXme/VmaX' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify release files
        shell: pwsh
        run: |
          Get-Item VmaX.exe, VmaX-Android-arm64.apk, VmaX-Relay-Linux-x86_64.tar.gz | Format-Table Name,Length,LastWriteTime
          if ((Get-Item VmaX.exe).Length -lt 1000000) { throw 'VmaX.exe is unexpectedly small.' }
          if ((Get-Item VmaX-Android-arm64.apk).Length -lt 1000000) { throw 'APK is unexpectedly small.' }

      - name: Publish the release after all builds succeed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo VibeXme/VmaX --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists."
            exit 0
          }
          gh release create $tag VmaX.exe VmaX-Android-arm64.apk VmaX-Relay-Linux-x86_64.tar.gz --target $env:GITHUB_SHA --title "VmaX $version" --notes-file release-notes.md --latest --repo VibeXme/VmaX
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
