name: Rebuild v5.3.3 binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vmax-v5.3.3-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path relay-server/Cargo.toml --locked

  rebuild-release-binaries:
    needs: relay-tests
    if: github.repository == 'VibeXme/VmaX' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend and Tauri dependencies
        shell: pwsh
        run: npm ci

      - name: Install Rust targets
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-linux-android

      - name: Fetch and verify required Windows tunnel helper
        shell: pwsh
        run: |
          $path = 'src-tauri/resources/cloudflared.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          $url = 'https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-windows-amd64.exe'
          Invoke-WebRequest -Uri $url -OutFile $path -MaximumRedirection 10
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          $expected = '2493dbc168923bb3e59e5e7716f71deced92992eea9acd6e9d74f84ac7751343'
          if ($actual -ne $expected) { throw "cloudflared.exe checksum mismatch: $actual" }

      - name: Run Rust authentication and transport unit tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'vmax-rust-tests.log'
          cargo test --manifest-path src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc --locked 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status) {
            $tail = Get-Content $log -Tail 75
            @('### Windows Rust test failure', '', '```text') + $tail + '```' |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            $summary = $tail -join "`n"
            if ($summary.Length -gt 3000) { $summary = $summary.Substring($summary.Length - 3000) }
            $summary = $summary.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows Rust tests failed::$summary"
            exit $status
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          npm.cmd run tauri -- build --ci --no-bundle --target x86_64-pc-windows-msvc -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $meta = cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps --locked | ConvertFrom-Json
          $exe = Join-Path $meta.target_directory 'x86_64-pc-windows-msvc\release\vmax.exe'
          if (-not (Test-Path $exe)) { throw "Windows executable was not produced at $exe" }
          Copy-Item -LiteralPath $exe -Destination 'VmaX.exe' -Force

      - name: Build Android ARM64 APK
        shell: pwsh
        run: |
          .\build_vmax_release.ps1 -SkipWindows -SkipInstaller
          if (-not (Test-Path 'VmaX-Android-arm64.apk')) {
            throw 'Android APK was not produced.'
          }

      - name: Verify release files
        shell: pwsh
        run: |
          Get-Item VmaX.exe, VmaX-Android-arm64.apk | Format-Table Name,Length,LastWriteTime
          if ((Get-Item VmaX.exe).Length -lt 1000000) { throw 'VmaX.exe is unexpectedly small.' }
          if ((Get-Item VmaX-Android-arm64.apk).Length -lt 1000000) { throw 'APK is unexpectedly small.' }

      - name: Publish v5.3.3 release after both builds succeed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          ## VmaX 5.3.3 — Relay selection and stream recovery

          - Select configured relays using bidirectional media packet round trips.
          - Run the standalone VmaX relay behind a TLS reverse proxy in regions near your players.
          - Resume Android decoding from a keyframe when the native frame handoff fails.

          ### Downloads
          - VmaX.exe — Windows portable
          - VmaX-Android-arm64.apk — Android ARM64

          Relay hosting and bandwidth are supplied by the operator. Actual latency depends on the network path and devices.
          '@
          $notes | Set-Content -Encoding utf8 'release-v5.3.3.md'
          gh release create v5.3.3 VmaX.exe VmaX-Android-arm64.apk --target "${{ github.sha }}" --title 'VmaX 5.3.3' --notes-file release-v5.3.3.md --repo VibeXme/VmaX
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
