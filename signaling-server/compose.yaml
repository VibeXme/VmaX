services:
  relay:
    build:
      context: ..
      dockerfile: signaling-server/Dockerfile
    restart: unless-stopped
  https:
    image: caddy:2-alpine
    depends_on:
      - relay
    environment:
      VMAX_RELAY_DOMAIN: "${VMAX_RELAY_DOMAIN:?Set VMAX_RELAY_DOMAIN to your public relay hostname}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - config:/config
    restart: unless-stopped

volumes:
  certificates:
  config:
