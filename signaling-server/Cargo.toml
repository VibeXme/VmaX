[package]
name = "vmax-signaling"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
futures-util = "0.3"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
